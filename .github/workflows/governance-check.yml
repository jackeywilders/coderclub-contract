name: governance-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate status JSON files
        run: |
          for f in status/pm.json status/backend.json status/frontend.json status/sync-manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

      - name: git diff --check
        run: git diff --check

      - name: Sensitive pattern scan on changed md/json files
        run: |
          git fetch origin main --quiet
          changed=$(git diff --name-only origin/main...HEAD -- '*.md' '*.json')
          if [ -z "$changed" ]; then
            echo "No md/json changes in this PR"
            exit 0
          fi
          hits=$(echo "$changed" | while read -r f; do
            [ -f "$f" ] || continue
            m=$(grep -E '([0-9]{1,3}\.){3}[0-9]{1,3}|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' "$f" 2>/dev/null | grep -vE '127\.0\.0\.1|0\.0\.0\.0')
            [ -n "$m" ] && echo "$f"
          done | sort -u || true)
          if [ -n "$hits" ]; then
            echo "Sensitive patterns detected in changed files (file names only; open each file to review, contents are not printed to avoid leaking in public logs):"
            echo "$hits"
            exit 1
          fi
          echo "Sensitive pattern scan passed"

      - name: Evidence gate (read-only)
        run: |
          set -eu
          # 1) Receipt summary structure: handoff/**/*-summary.json (excluding templates)
          required="taskId taskTitle receiptPath sourceProject implementationCommitSha receiptCommitSha pullRequestNumber contractSnapshotSha256 verificationResult verificationDate"
          for f in $(git ls-files 'handoff/**/*-summary.json' | grep -v '_template-'); do
            node -e "
              const d = JSON.parse(require('fs').readFileSync('$f','utf8'));
              const req = '$required'.split(' ');
              const miss = req.filter(k => !(k in d));
              if (miss.length) { console.error('$f missing fields: ' + miss.join(',')); process.exit(1); }
              console.log('$f OK');
            "
          done
          # 2) Status cross-consistency (whitelist): pm.json only for now
          node -e "
            const pm = JSON.parse(require('fs').readFileSync('status/pm.json','utf8'));
            const reports = pm.m4AcceptanceReports || {};
            for (const t of Object.keys(reports)) {
              if (typeof pm.state === 'string' && pm.state.includes(t + '-in-progress')) {
                console.error('state declares ' + t + '-in-progress but m4AcceptanceReports has a close acceptance for it'); process.exit(1);
              }
            }
            if ((pm['m4-03Supplement'] || {}).status === 'covered' && typeof pm.state === 'string' && pm.state.includes('m4-03-pending')) {
              console.error('m4-03Supplement covered but state still declares m4-03-pending'); process.exit(1);
            }
            console.log('status cross-consistency OK');
          "
          # 3) Referenced commits exist in history (existence = R1); referenced paths exist.
          #    In-repo refs only: reviewedCommit/snapshotCommit are contract-repo commits.
          #    contractSnapshot.sourceCommit lives in the private backend repo and is cross-repo
          #    by design — human-chain verified (backend review signs it), not checked here.
          node -e "
            const cp = require('child_process');
            const pm = JSON.parse(require('fs').readFileSync('status/pm.json','utf8'));
            const refs = [pm.reviewedCommit, pm.contractSnapshot && pm.contractSnapshot.snapshotCommit].filter(Boolean);
            for (const sha of refs) {
              const r = cp.spawnSync('git', ['cat-file', '-e', sha + '^{commit}'], {stdio: 'pipe'});
              if (r.status !== 0) { console.error('referenced commit not found: ' + sha); process.exit(1); }
            }
            for (const p of [pm.auditReport, pm.reviewReport, pm.coordinationRoadmap, pm.acceptanceReport, pm['g1-03BackendAcceptanceReport'], pm['g1-03CloseAcceptanceReport'], pm['g1-04CloseAcceptanceReport'], pm.m4SixProposal].filter(Boolean)) {
              const r = cp.spawnSync('git', ['cat-file', '-e', 'HEAD:' + p], {stdio: 'pipe'});
              if (r.status !== 0) { console.error('referenced path not found: ' + p); process.exit(1); }
            }
            for (const p of Object.values((pm.m4AcceptanceReports || {}))) {
              const r = cp.spawnSync('git', ['cat-file', '-e', 'HEAD:' + p], {stdio: 'pipe'});
              if (r.status !== 0) { console.error('referenced path not found: ' + p); process.exit(1); }
            }
            console.log('referenced commits/paths OK');
          "

      - name: Enable auto-merge (no-conflict PRs merge automatically)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ github.event.pull_request.number }}"
